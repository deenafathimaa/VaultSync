<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="app-body">

<div class="sidebar">
    <h2>VaultSync</h2>
    <a href="/dashboard">Dashboard</a>
    <a href="/upload">Upload File</a>
    <a href="/files">My Files</a>
    <a href="/shared">Shared With Me</a>
    <a href="/change-password">Change Password</a>
    <a href="/logout">Logout</a>
</div>

<div class="main-content">

    <div class="topbar">
        <h1>Change Password</h1>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="toast-container">
        {% for category, message in messages %}
        <div class="toast {{ category }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="password-wrapper">
        <div class="password-card">

            <form method="POST">

                <!-- OLD -->
                <label>Old Password</label>
                <div class="input-group">
                    <input type="password" name="old_password"
                           placeholder="Enter your old password" required>

                    <span class="toggle-password" onclick="togglePassword(this)">
                        <svg width="22" height="22" fill="none" stroke="white"
                             stroke-width="2" viewBox="0 0 24 24">
                            <path class="eye-slash" d="M1 1l22 22" style="display:block"/>
                            <path d="M17.94 17.94A10.94 10.94 0 0112 19C5 19 1 12 1 12a21.82 21.82 0 015.17-6.53M9.88 4.24A10.94 10.94 0 0112 5c7 0 11 7 11 7a21.82 21.82 0 01-4.35 5.77"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </span>
                </div>

                <!-- NEW -->
                <label>New Password</label>
                <div class="input-group">
                    <input type="password" name="new_password"
                           placeholder="Enter your new password" required>

                    <span class="toggle-password" onclick="togglePassword(this)">
                        <svg width="22" height="22" fill="none" stroke="white"
                             stroke-width="2" viewBox="0 0 24 24">
                            <path class="eye-slash" d="M1 1l22 22" style="display:block"/>
                            <path d="M17.94 17.94A10.94 10.94 0 0112 19C5 19 1 12 1 12a21.82 21.82 0 015.17-6.53M9.88 4.24A10.94 10.94 0 0112 5c7 0 11 7 11 7a21.82 21.82 0 01-4.35 5.77"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </span>
                </div>

                <!-- CONFIRM -->
                <label>Confirm New Password</label>
                <div class="input-group">
                    <input type="password" name="confirm_password"
                           placeholder="Confirm your new password" required>

                    <span class="toggle-password" onclick="togglePassword(this)">
                        <svg width="22" height="22" fill="none" stroke="white"
                             stroke-width="2" viewBox="0 0 24 24">
                            <path class="eye-slash" d="M1 1l22 22" style="display:block"/>
                            <path d="M17.94 17.94A10.94 10.94 0 0112 19C5 19 1 12 1 12a21.82 21.82 0 015.17-6.53M9.88 4.24A10.94 10.94 0 0112 5c7 0 11 7 11 7a21.82 21.82 0 01-4.35 5.77"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </span>
                </div>

                <button type="submit">Update Password</button>

            </form>

        </div>
    </div>

</div>

<script>
function togglePassword(icon) {
    const input = icon.previousElementSibling;
    const slash = icon.querySelector(".eye-slash");

    if (input.type === "password") {
        input.type = "text";
        slash.style.display = "none";
    } else {
        input.type = "password";
        slash.style.display = "block";
    }
}

setTimeout(function() {
    const toasts = document.querySelectorAll(".toast");
    toasts.forEach(function(toast) {
        toast.classList.add("hide");
        setTimeout(() => toast.remove(), 500);
    });
}, 3000);
</script>

</body>
</html>
